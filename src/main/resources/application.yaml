spring:
  application:
    name: aureva-mvp-transcribe

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aureva}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

aureva:
  audio:
    ffmpeg:
      executable: ${FFMPEG_PATH:ffmpeg}

  transcription:
    default-engine: ${TRANSCRIPTION_ENGINE:vosk}
    default-language: ${TRANSCRIPTION_LANGUAGE:en}

    engines:
      vosk:
        models:
          english: ${VOSK_MODEL_EN:models/vosk-model-en-us-0.22}
          russian: ${VOSK_MODEL_RU:models/vosk-model-ru-0.42}
